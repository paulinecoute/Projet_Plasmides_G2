{% extends 'biolib/base.html' %}

{% block content %}
<style>
  :root {
    --bg-main: #f0f7ff;
    --app-primary: #007bff;
    --border-color: rgba(0, 123, 255, 0.1);
    --text-dark: #004085;
  }

  body { background-color: var(--bg-main); }

  .auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 30px;
    padding: 45px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 15px 35px rgba(0, 123, 255, 0.05);
  }

  .auth-title {
    font-weight: 800;
    font-size: 2.2rem;
    color: var(--text-dark);
    letter-spacing: -0.04em;
    margin-bottom: 10px;
    text-align: center;
  }

  .form-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--app-primary);
    margin-bottom: 8px;
    display: block;
  }

  input[type="text"], input[type="password"], input[type="email"] {
    display: block;
    width: 100%;
    border: 1px solid #e1e8ed;
    background: #fdfdfd;
    border-radius: 15px;
    padding: 14px 18px;
    font-size: 1rem;
    transition: all 0.2s;
    margin-bottom: 5px;
  }

  input:focus {
    background: #fff;
    border-color: var(--app-primary);
    box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
    outline: none;
  }

  .btn-auth-submit {
    background: var(--app-primary);
    color: #fff;
    padding: 14px;
    border-radius: 15px;
    font-weight: 700;
    border: none;
    width: 100%;
    transition: all 0.2s;
    box-shadow: 0 8px 20px rgba(0, 123, 255, 0.2);
    margin-top: 20px;
  }

  .btn-auth-submit:hover {
    background: #0056b3;
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(0, 123, 255, 0.3);
  }

  .auth-footer {
    margin-top: 30px;
    text-align: center;
    font-size: 0.95rem;
    color: #6c757d;
  }

  .auth-link {
    color: var(--app-primary);
    text-decoration: none;
    font-weight: 700;
  }
  .auth-link:hover { text-decoration: underline; }

  .errorlist {
    list-style: none;
    padding: 0;
    color: #dc3545;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 5px;
  }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary fs-1 opacity-25"></i>
            <h1 class="auth-title">Connexion</h1>
            <p class="text-muted small">Heureux de vous revoir sur BioLib.</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="errorlist">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-auth-submit">
                Se connecter
            </button>
        </form>

        <div class="auth-footer">
            <span>Pas encore de compte ?</span><br>
            <a href="{% url 'signup' %}" class="auth-link">Créer un compte</a>
        </div>
    </div>
</div>
{% endblock %}
