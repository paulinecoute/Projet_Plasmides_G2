{% extends 'biolib/base.html' %}

{% block content %}
<div class="container">
    <h2>Visualisation : {{ plasmid.name }}</h2>

    <div id="seqviz-root" style="height: 600px; width: 100%; border: 1px solid #ccc; margin-top: 20px;"></div>

    <div style="margin-top: 15px;" class="d-flex gap-2">
        <a href="javascript:history.back()" class="btn btn-secondary">Retour</a>
    </div>
</div>

<script src="https://unpkg.com/seqviz"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {

        // Récupération sécurisée des données envoyées par la vue Django
        const plasmidName = "{{ plasmid.identifier|escapejs }}";
        const fileContent = "{{ genbank_content|escapejs }}";

        const viewerOptions = {
            name: plasmidName,
            file: fileContent, // Le contenu brut du fichier GenBank
            style: { height: "100%", width: "100%" },
            viewer: "both", // Affiche linéaire et circulaire
            showComplement: true,
            zoom: { linear: 50 }
        };

        // Rendu du visualiseur dans la div "seqviz-root"
        window.seqviz
            .Viewer("seqviz-root", viewerOptions)
            .render();
    });
</script>
{% endblock %}
