{% extends "biolib/base.html" %}

{% block title %}Nouvelle collection · {{ team.name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="mx-auto" style="max-width: 650px;">
    
    <div class="mb-4">
      <a href="{% url 'team_collections' team.id %}" class="btn btn-outline-secondary btn-sm rounded-3">
        <i class="bi bi-arrow-left me-1"></i> Retour
      </a>
    </div>

    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold text-dark mb-1">Nouvelle Collection</h1>
      <p class="text-muted text-uppercase fw-bold small" style="letter-spacing: 0.1em;">
        Équipe : <span class="text-primary">{{ team.name }}</span>
      </p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        
        <div class="mb-4">
          <label class="form-label small fw-bold text-primary text-uppercase">Nom de la collection</label>
          <input type="text" name="name" class="form-control form-control-lg border-light bg-light rounded-3" required placeholder="Ex: Séquences CRISPR 2026">
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-primary text-uppercase">Description (optionnelle)</label>
          <textarea name="description" class="form-control border-light bg-light rounded-3" rows="3" placeholder="À quoi servira cette collection ?"></textarea>
        </div>

        <div class="mb-0">
          <label class="form-label small fw-bold text-primary text-uppercase">Propriétaire référent</label>
          <select name="owner" class="form-select form-select-lg border-light bg-light rounded-3" required>
            {% for member in members %}
              <option value="{{ member.id }}" {% if member == user %}selected{% endif %}>
                {{ member.email }}
              </option>
            {% endfor %}
          </select>
          <div class="form-text mt-2">
            <i class="bi bi-info-circle me-1"></i> Le propriétaire aura les droits de gestion sur les fichiers de cette collection.
          </div>
        </div>

      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-4 py-3">
        <i class="bi bi-check-circle-fill me-2"></i> Créer la collection
      </button>
    </form>
    
  </div>
</div>
{% endblock %}
