{% extends "biolib/base.html" %}

{% block title %}Créer une équipe{% endblock %}

{% block content %}
<style>
  :root {
    --bg-main: #f0f7ff; 
    --app-primary: #007bff;
    --border-color: rgba(0, 123, 255, 0.1);
  }

  body { background-color: var(--bg-main); }

  .content-wrapper {
    max-width: 700px; 
    margin: 40px auto;
    padding-bottom: 50px;
  }

  .btn-back-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 45px;
    height: 45px;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 15px;
    color: var(--app-primary);
    transition: all 0.2s;
    text-decoration: none;
    margin-bottom: 25px;
  }
  .btn-back-circle:hover { 
    background: var(--app-primary); 
    color: #fff;
    transform: translateX(-3px);
  }

  .hero-section { margin-bottom: 30px; }
  .page-title { 
    font-weight: 800; 
    font-size: 2.6rem; 
    color: #004085;
    letter-spacing: -0.04em; 
  }
  
  .form-container {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 30px;
    padding: 45px;
    box-shadow: 0 15px 35px rgba(0, 123, 255, 0.05);
  }

  .form-label {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #007bff;
    margin-bottom: 10px;
  }

  .form-control, .form-select {
    border: 1px solid #e1e8ed;
    background: #fdfdfd;
    border-radius: 15px;
    padding: 14px 18px;
    font-size: 1rem;
    transition: all 0.2s;
  }

  .form-control:focus, .form-select:focus {
    background: #fff;
    border-color: var(--app-primary);
    box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
    outline: none;
  }

  .btn-submit-team {
    background: var(--app-primary);
    color: #fff;
    padding: 14px 35px;
    border-radius: 15px;
    font-weight: 700;
    border: none;
    transition: all 0.2s;
    box-shadow: 0 8px 20px rgba(0, 123, 255, 0.2);
  }
  .btn-submit-team:hover { 
    background: #0056b3; 
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(0, 123, 255, 0.3);
  }

  .btn-cancel-soft {
    color: #adb5bd;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: 0.2s;
    padding: 10px 20px;
  }
  .btn-cancel-soft:hover { color: #495057; }

  .form-text { font-size: 0.85rem; color: #999; margin-top: 8px; }

  /* Icône décorative */
  .header-icon {
    font-size: 2.5rem;
    color: var(--app-primary);
    margin-bottom: 15px;
    display: inline-block;
  }
</style>

<div class="container">
  <div class="content-wrapper">
    
    <a href="{% url 'teams' %}" class="btn-back-circle shadow-sm">
      <i class="bi bi-arrow-left fs-5"></i>
    </a>

    <div class="hero-section">
      <div class="header-icon"><i class="bi bi-people-fill"></i></div>
      <h1 class="page-title">Nouvelle équipe</h1>
      <p class="text-muted fs-5">Initialisez un espace de travail collaboratif pour vos projets de recherche.</p>
    </div>

    <div class="form-container">
      <form method="post">
        {% csrf_token %}

        <div class="mb-4">
          <label class="form-label">Nom de l’équipe</label>
          <input type="text" name="name" class="form-control" placeholder="Ex: Laboratoire Génétique Alpha" required>
          <div class="form-text">Ce nom sera visible par tous les membres invités.</div>
        </div>

        <div class="mb-4">
          <label class="form-label">Description <span class="fw-normal text-muted" style="text-transform: none;">(optionnel)</span></label>
          <textarea name="description" class="form-control" rows="4" placeholder="Décrivez brièvement les objectifs du groupe..."></textarea>
        </div>

        <div class="mb-5">
          <label class="form-label">Objectif principal</label>
          <select name="purpose" class="form-select">
            <option value="" disabled selected>— Pourquoi créez-vous cette équipe ? —</option>
            <option value="research">🔬 Recherche & Développement</option>
            <option value="experiments">🧪 Campagnes de simulation</option>
            <option value="collaboration">🤝 Partage de collections</option>
          </select>
        </div>

        <div class="d-flex align-items-center justify-content-end gap-3 mt-2">
          <a href="{% url 'teams' %}" class="btn-cancel-soft">
            Annuler
          </a>
          <button type="submit" class="btn-submit-team">
            Créer l'espace équipe
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
