{% extends "biolib/base.html" %}

{% block title %}Créer une équipe{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="mx-auto" style="max-width: 800px;">
    
    <div class="mb-4">
      <a href="{% url 'teams' %}" class="btn btn-outline-secondary btn-sm rounded-3">
        <i class="bi bi-arrow-left me-1"></i> Retour
      </a>
    </div>

    <div class="mb-5 text-center text-md-start">
      <h1 class="display-5 fw-bold text-primary">Nouvelle équipe</h1>
      <p class="text-muted">Partagez vos ressources et collaborez sur vos projets.</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <form method="post">
        {% csrf_token %}

        <div class="mb-4">
          <label class="form-label small fw-bold text-primary text-uppercase">Nom de l’équipe</label>
          <input type="text" name="name" class="form-control form-control-lg border-light bg-light rounded-3" placeholder="Ex: Projet Plasmides 2026" required>
          <div class="form-text text-muted">Choisissez un nom clair pour vos collaborateurs.</div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-primary text-uppercase">Description <span class="text-lowercase fw-normal">(optionnel)</span></label>
          <textarea name="description" class="form-control border-light bg-light rounded-3" rows="3" placeholder="Objectif ou contexte scientifique..."></textarea>
        </div>

        <div class="mb-5">
          <label class="form-label small fw-bold text-primary text-uppercase">Objectif principal</label>
          <select name="purpose" class="form-select border-light bg-light rounded-3">
            <option value="">— Sélectionner un objectif —</option>
            <option value="research">Recherche & développement</option>
            <option value="experiments">Expérimentations & campagnes</option>
            <option value="collaboration">Projet collaboratif / enseignement</option>
          </select>
        </div>

        <div class="d-flex align-items-center justify-content-end gap-3">
          <a href="{% url 'teams' %}" class="btn btn-link text-decoration-none text-muted fw-bold">
            Annuler
          </a>
          <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill fw-bold">
            Créer
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
