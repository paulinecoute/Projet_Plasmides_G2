{% extends "biolib/base.html" %}

{% block content %}
<style>
  :root {
    --bg-main: #f0f7ff; 
    --border-color: rgba(0, 123, 255, 0.1);
    --danger-soft: #ff4d4d;
  }

  .content-wrapper {
    max-width: 550px; 
    margin: 80px auto;
    text-align: center;
    background: #fff;
    padding: 50px 40px;
    border-radius: 30px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border-color);
  }

  .warning-icon {
    width: 80px;
    height: 80px;
    background: #fff5f5;
    color: var(--danger-soft);
    font-size: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 25px;
    margin: 0 auto 25px;
    box-shadow: 0 8px 20px rgba(255, 77, 77, 0.15);
  }

  .page-title { 
    font-weight: 700; 
    font-size: 1.8rem; 
    color: #004085;
    margin-bottom: 10px;
  }

  .template-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: #007bff;
    background: #f0f7ff;
    padding: 8px 20px;
    border-radius: 50px;
    display: inline-block;
    margin-bottom: 25px;
    border: 1px solid rgba(0, 123, 255, 0.1);
  }

  .warning-text {
    color: #6c757d;
    font-size: 0.95rem;
    margin-bottom: 40px;
    line-height: 1.6;
  }

  .btn-container {
    display: flex;
    flex-direction: column-reverse; 
    gap: 15px;
  }

  @media (min-width: 576px) {
    .btn-container {
      flex-direction: row;
      justify-content: center;
    }
  }

  .btn-delete-final {
    background: var(--danger-soft);
    color: #fff;
    border: none;
    padding: 12px 25px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  
  .btn-delete-final:hover { 
    background: #e60000; 
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 77, 77, 0.3);
    color: #fff;
  }

  .btn-cancel-link {
    background: #f8f9fa;
    color: #6c757d;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 12px 25px;
    border-radius: 14px;
    transition: all 0.2s;
    border: 1px solid #eee;
  }
  
  .btn-cancel-link:hover { 
    background: #eee;
    color: #333; 
  }
</style>

<div class="container">
  <div class="content-wrapper">
    
    <div class="warning-icon">
      <i class="bi bi-trash3-fill"></i>
    </div>

    <h1 class="page-title">Confirmation</h1>
    
    <div>
      <span class="template-name">{{ template.name }}</span>
    </div>

    <p class="warning-text">
      Attention, cette action est <strong>définitive</strong>.<br> 
      Le template sera supprimé de votre bibliothèque InSillyClo.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="btn-container">
        <a href="{% url 'template_detail' template.id %}" class="btn-cancel-link">
          Annuler
        </a>
        
        <button type="submit" class="btn-delete-final shadow-sm">
          Supprimer définitivement
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
